version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kvist_postgres
    environment:
      POSTGRES_DB: kvist_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend   
      dockerfile: Dockerfile
    container_name: kvist_backend
    ports:
      - "8000:8080"        
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=kvist_db;Username=admin;Password=secretpassword
      
      - Jwt__Key=SuperSecretKey1234567890EncryptionKeyMustBeLongEnoughForJwtToken
      - Jwt__Issuer=Backend
      - Jwt__Audience=Frontend
    depends_on:
      - postgres

volumes:
  pgdata: